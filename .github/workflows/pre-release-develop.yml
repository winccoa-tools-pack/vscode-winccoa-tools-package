name: Pre-Release (Develop)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs: {}

concurrency:
  group: prerelease-develop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: write
  checks: write
  issues: write

jobs:
  pre-release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request' }}
    uses: winccoa-tools-pack/.github/.github/workflows/reusable-prerelease.yml@main
    with:
      target_branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      validate_release_branch: false
      project_type: vscode
    secrets: inherit

  cleanup-old-prereleases:
    needs: [pre-release]
    if: always() && needs.pre-release.result == 'success'
    uses: winccoa-tools-pack/.github/.github/workflows/reusable-cleanup-prereleases-by-branch.yml@main
    with:
      target_branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      keep_latest: 2
    secrets: inherit

  notify-success:
    runs-on: ubuntu-latest
    needs: [pre-release, cleanup-old-prereleases]
    if: success()

    steps:
      - name: Success Notification
        run: |
          echo "🧪 Dev pre-release ${{ needs.pre-release.outputs.tag }} created successfully!"
          echo "📦 Tested VSIX attached to the GitHub pre-release"
          echo "🔍 Available for testing and validation"
          echo "📝 Trigger: ${{ github.event_name }}"
          echo ""
          echo "🔗 Pre-release URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.pre-release.outputs.tag }}"
